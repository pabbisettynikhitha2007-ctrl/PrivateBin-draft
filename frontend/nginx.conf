server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unmatched route (e.g. /view/abc123) serves index.html
    # so React Router can handle it client-side instead of nginx 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
