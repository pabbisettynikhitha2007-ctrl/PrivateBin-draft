services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    volumes:
      - paste-data:/app/data
    environment:
      - DB_PATH=/app/data/pastes.db
      - CORS_ORIGIN=http://localhost:5173
      - FRONTEND_URL=http://localhost:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:4000/api
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  paste-data:
